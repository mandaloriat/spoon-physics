[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spoon-physics"
version = "0.1.0"
description = "An interactive physics laboratory built on Fenix Spoon and FEniCSx"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Pinned to a commit, not a branch and not the tag. Upstream cut v0.1.0, but it points
    # three commits before `regions3d` exists — so the release would pin away the 3-D geometry
    # the heat sink sends. See docs/architecture-decisions.md, ADR-007, for that and for the
    # upgrade procedure.
    # This SHA must match FENIX_SPOON_COMMIT everywhere else in the repository;
    # scripts/check-pins.sh fails CI when it does not.
    "fenixspoon @ git+https://github.com/mandaloriat/fenix-spoon@3d483a38d619b3b6c2d88e798ca0be5420d5ef6d#subdirectory=server",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    # tests/test_worker.py reads the compose files. PyYAML arrives anyway as a transitive
    # dependency of uvicorn's `standard` extra, but a test that imports it directly should
    # say so rather than rely on another package's extras staying what they are today.
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://lab.andolfatto.eu"
Source = "https://github.com/mandaloriat/spoon-physics"
"Built with" = "https://github.com/mandaloriat/fenix-spoon"

[tool.setuptools.packages.find]
include = ["physics_lab*"]

[tool.ruff]
# Matches Fenix Spoon's own configuration, so code moving between the two repositories
# does not have to be reformatted.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
# 3.12, not the 3.11 floor in `requires-python`, and the reason is a dependency's stubs rather
# than our own code. `physics_lab.solvers` imports NumPy, so mypy follows NumPy's type stubs —
# and from NumPy 2.5 those stubs use `type X = ...`, which mypy refuses when told to target 3.11:
#
#   numpy/__init__.pyi:737: error: Type statement is only supported in Python 3.12 and greater
#
# The failure is environment-dependent, which is how it reached CI unseen: NumPy 2.5 requires
# Python >= 3.12, so a 3.11 checkout resolves NumPy 2.4 and its stubs parse under any target.
# That is also why raising the target cannot backfire — the stubs needing 3.12 exist only where
# the interpreter running mypy is 3.12 or newer.
#
# What this gives up is mypy checking our code against 3.11 *semantics*. Two things in CI keep
# that promise instead: ruff's `target-version = "py311"` refuses anything newer than the floor,
# and the pytest matrix runs the suite on 3.11. The alternative — telling mypy to skip NumPy's
# stubs — would leave every array expression in the panel method unchecked, which is most of the
# code this setting exists to check.
python_version = "3.12"
files = ["physics_lab"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:physics_lab.*"]
