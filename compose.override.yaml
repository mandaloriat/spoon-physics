# Development conveniences. Compose loads this automatically for a bare
# `docker compose up`, and ignores it when the production file is named explicitly:
#
#   docker compose up -d --build                                    # with this file
#   docker compose -f compose.yaml -f compose.production.yaml up -d  # without it
#
# That asymmetry is the point. Compose merges `ports` by appending entries, so a port
# published in compose.yaml could not be un-published by compose.production.yaml — the
# only way to be certain production exposes nothing but Caddy is for the base file to
# publish nothing at all.
services:
  api:
    build:
      args:
        # The mock-solver image: ~100 MB against ~3 GB, and the whole protocol, both
        # widgets and the airfoil experiment run on it. Front-end work never needs FEniCSx.
        FENIX_SPOON_IMAGE: ${FENIX_SPOON_IMAGE:-ghcr.io/mandaloriat/fenix-spoon:sha-3d483a3-slim}
    # A separate tag from LAB_IMAGE, which production uses. Sharing one would let a
    # development build — mock solvers only — overwrite the tag production then starts,
    # and the symptom would be a production site that quietly lost its FEniCSx mode.
    image: ${LAB_DEV_IMAGE:-physics-lab:dev}
    ports:
      # Loopback only, even here. A laptop on a café network should not be serving a
      # solver to the room.
      - "127.0.0.1:${LAB_DEV_PORT:-8000}:8000"

# The job limits are deliberately *not* relaxed here. Development inherits exactly the
# caps `.env` sets for production, so a budget refusal or a timeout shows up on a laptop
# rather than for the first visitor. Raise them by editing `.env` when a particular
# experiment needs it — a fallback here would not have worked anyway, since a value set in
# `.env` wins over a `${VAR:-default}` in a compose file.
