name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A red build should never be a queued build behind an obsolete one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one place CI names the pin, and — since the bump to 4e7c296 walked straight past it —
  # one of the files `check-pins.sh` reads. It used to say it was checked here and was not,
  # which is exactly the silent skew ADR-007 exists to prevent: the image stage would build
  # the widgets from the new commit onto a runtime whose `fenixspoon` was the old one, and the
  # first symptom was an ImportError three minutes into a Docker build.
  FENIX_SPOON_SLIM_IMAGE: ghcr.io/mandaloriat/fenix-spoon:sha-3d483a3-slim

jobs:
  # ────────────────────────────────────────────────────────────────── static checks
  checks:
    name: Lint, types, pins, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - run: ruff check .

      - run: mypy

      - name: Fenix Spoon pin is consistent
        # Before the tests, not after: a pin that disagrees with itself makes every other
        # result meaningless, and the message is more useful than a mysterious failure.
        run: ./scripts/check-pins.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Front-end formatting
        run: npm run lint

      - name: The two languages agree
        # A key the Italian catalogue never got shows English inside Italian prose, and a page
        # asking for a key neither catalogue has prints the key. Both are invisible to a test
        # that only loads a page in one language, so they are checked directly.
        run: npm run check:i18n

      - name: No committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Essential documentation is present and honest
        # Documentation that quietly loses its deployment section is how a project becomes
        # un-deployable by anyone but its author, and the disclaimer is a requirement of
        # the project rather than a nicety.
        #
        # Every assertion runs against *rendered* text, not raw source. `grep` was the
        # obvious tool and the wrong one: the attribution reads
        # "Built with [Fenix Spoon](…)" in Markdown, so `grep "Built with Fenix Spoon"`
        # failed on a README that says exactly that to a reader. The same trap caught the
        # disclaimer, which is line-wrapped and inside a blockquote. Flattening first means
        # these check meaning, and stop depending on where a line break happens to fall.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          REQUIRED_FILES = ["README.md", "LICENSE", ".env.example", "docs/architecture-decisions.md"]

          REQUIRED_SECTIONS = [
              "Quick start",
              "Production",
              # Renamed from "Current experiments" by ADR-022, which made the pages challenges
              # rather than experiments and renamed them everywhere a reader meets them.
              "Current challenges",
              "The pinned dependency",
              "Security and the limits of a public demo",
          ]

          # The wording changed with ADR-022 (§6.9 of the editorial review): the old sentence
          # promised a substitute for professional verification and then withheld it, which is
          # a longer way of saying less. What this check is for has not changed — no page ships
          # without an educational disclaimer — so it follows the wording rather than pinning it.
          DISCLAIMER = "not professional engineering tools"
          # Every experiment page carries it, not just the first one. Listed explicitly
          # rather than globbed: the point is that a *new* page cannot ship without the
          # disclaimer, and a glob would happily find nothing and pass.
          #
          # The bridge and the heat sink were missing from this list from the release that
          # built them until ADR-022 — which is exactly the failure the sentence above warns
          # about, arriving by the other door: the list is only explicit if somebody extends it.
          # Extending it is therefore part of adding a page, the way `scripts/check-i18n.mjs`
          # and `tests/test_frontend.py` both carry a list that has to be extended by hand.
          DISCLAIMER_FILES = [
              "README.md",
              "frontend/index.html",
              "frontend/experiments/airfoil/index.html",
              "frontend/experiments/solenoid/index.html",
              "frontend/experiments/truss/index.html",
              "frontend/experiments/heatsink/index.html",
              "frontend/experiments/sensor/index.html",
          ]

          def rendered(path: str) -> str:
              """Roughly what a reader sees: no link syntax, no blockquote markers, no wrapping."""
              text = pathlib.Path(path).read_text(encoding="utf-8")
              text = re.sub(r"\[([^\]]+)\]\([^)]*\)", r"\1", text)   # [label](url) -> label
              text = re.sub(r"(?m)^\s*>\s?", "", text)               # blockquote markers
              text = re.sub(r"[*`_]", "", text)                      # emphasis and code ticks
              return re.sub(r"\s+", " ", text)                       # unwrap

          problems = []

          for path in REQUIRED_FILES:
              file = pathlib.Path(path)
              if not file.is_file() or not file.stat().st_size:
                  problems.append(f"missing or empty: {path}")

          if not problems:
              readme = rendered("README.md")
              for section in REQUIRED_SECTIONS:
                  if section not in readme:
                      problems.append(f"README lost its {section!r} section")
              # Attribution is owed to Fenix Spoon and FEniCSx; affiliation is not claimed.
              if "Built with Fenix Spoon" not in readme:
                  problems.append("README no longer attributes Fenix Spoon")
              if "not affiliated" not in readme:
                  problems.append("README no longer disclaims affiliation with the FEniCS Project")
              for path in DISCLAIMER_FILES:
                  if DISCLAIMER not in rendered(path):
                      problems.append(f"missing the educational disclaimer: {path}")

          if problems:
              sys.exit("\n".join(problems))
          print(
              f"{len(REQUIRED_FILES)} documents present, {len(REQUIRED_SECTIONS)} README sections, "
              f"attribution intact, disclaimer in {len(DISCLAIMER_FILES)} files"
          )
          PY

  # ────────────────────────────────────────────────────────────────── python tests
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject's requires-python, and the version the images run.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build the Fenix Spoon widgets from the pinned commit
        # The suite asserts the vendored bundles are served, because a checkout that
        # skipped this step produces a page whose only symptom is that nothing happens.
        run: ./scripts/fetch-widgets.sh

      - run: pytest -q

  # ─────────────────────────────────────────────────── the image, and a real browser
  container:
    name: Image build, smoke test, browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the slim image
        # Slim on purpose. The FEniCSx base is ~3 GB and the code path it adds belongs to
        # Fenix Spoon, which tests its own adapters inside that exact image. What CI here
        # has to prove is the part this repository wrote — the app, the site, the widget
        # build stage, the protocol integration — and all of it runs on the mock solvers.
        # A FEniCSx job would triple the build time to re-test someone else's code.
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: physics-lab:ci
          build-args: |
            FENIX_SPOON_IMAGE=${{ env.FENIX_SPOON_SLIM_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name lab -p 8000:8000 physics-lab:ci
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 2
          done

      - name: Logs on failure
        if: failure()
        run: docker logs lab

      - name: Smoke test
        run: ./scripts/smoke-test.sh http://127.0.0.1:8000

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        # The only thing that proves the import map resolves, the custom elements upgrade
        # and the WebSocket carries progress. The Python suite cannot.
        run: BASE_URL=http://127.0.0.1:8000 npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Container logs
        if: always()
        run: docker logs lab 2>&1 | tail -50

      - name: Stop
        if: always()
        run: docker rm -f lab
